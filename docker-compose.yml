      KEYCLOAK_URL: http://keycloak:8080/realms/hacknc-hospital
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      APPROVAL_URL: http://approval-service:8007
      AUDIT_URL: http://audit-service:8006
      EHR_MCP_URL: http://ehr-mcp:8010/mcp
    volumes: *aws-profile   # the coordinator is a Strands agent too
    ports:
